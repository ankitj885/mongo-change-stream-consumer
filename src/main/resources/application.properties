# ----------------------------------------
# KAFKA CONFIGURATION
# ----------------------------------------
# Set the address of your Kafka brokers
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ----------------------------------------
# DEBEZIUM CONNECTOR CONFIGURATION
# ----------------------------------------
# A unique name for the connector
debezium.name=mongo-connector

# Specify the MongoDB connector class
debezium.connector.class=io.debezium.connector.mongodb.MongoDbConnector

# Connection string for your MongoDB replica set
# NOTE: MongoDB MUST be a replica set for change streams to work.
debezium.mongodb.connection.string=mongodb://localhost:27017/?replicaSet=rs0

# A unique name that identifies the database server. Topics are prefixed with this.
debezium.topic.prefix=mongo-server

# List of databases and collections to monitor
debezium.database.include.list=your_database
debezium.collection.include.list=your_database.users,your_database.orders

# --- Offset Storage ---
# We use a file-based offset storage for simplicity
debezium.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.offset.storage.file.filename=/tmp/mongo-offsets.dat
debezium.offset.flush.interval.ms=10000

# Get the full document on update
debezium.capture.mode=change_streams_with_full_document
debezium.tasks.max=1